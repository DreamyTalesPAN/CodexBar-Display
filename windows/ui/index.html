<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeTV Control Center</title>
<style>
  /* Calm look (epic #713): light surface, one font, sizes 28 / 13, weights 400 / 600, ink + muted text. */
  /* Geist is not bundled with the Windows app, so the page uses the same name first and the system fallback. */
  html, body { height: 100%; margin: 0; background: #F9F9F9; color: #1B1B1B; font: 400 13px/1.5 Geist, ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 32px; box-sizing: border-box; }
  h1 { font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { margin: 0; color: #444933; max-width: 44em; }
  /* Errors are an overlay over the page, not a heading on it (calm rule 7). */
  #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; background: rgba(0, 0, 0, 0.10); }
  #error .card { width: 440px; max-width: 100%; box-sizing: border-box; padding: 20px; border-radius: 14px; background: #F9F9F9; box-shadow: 0 0 0 1px rgba(27, 27, 27, 0.10), 0 16px 40px rgba(0, 0, 0, 0.18); text-align: left; }
  #error h2 { font-size: 13px; font-weight: 600; line-height: 20px; margin: 0; color: #1B1B1B; }
  #error p { margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <div id="starting"><h1>Starting the VibeTV Companion…</h1><p>This takes a few seconds after installation.</p></div>
  <div id="updating" style="display: none"><h1>Updating VibeTV Control Center…</h1><p>Installing version <span id="version"></span>. The app restarts by itself.</p></div>
  <div id="error" role="alertdialog" aria-labelledby="error-title" aria-describedby="detail" style="display: none"><div class="card"><h2 id="error-title">VibeTV Control Center could not start its Companion.</h2><p id="detail"></p></div></div>
</main>
<script>
  window.addEventListener("vibetv:shell-status", function (event) {
    var detail = (event.detail && event.detail.error) || "";
    var update = (event.detail && event.detail.update) || "";
    document.getElementById("starting").style.display = detail || update ? "none" : "";
    document.getElementById("updating").style.display = update ? "" : "none";
    document.getElementById("version").textContent = update;
    document.getElementById("error").style.display = detail ? "" : "none";
    document.getElementById("detail").textContent = detail;
  });
</script>
</body>
</html>
