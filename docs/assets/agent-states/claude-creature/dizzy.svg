<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 -9 24 25.5" width="240" height="255" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    
    
    <g id="pixel-star" fill="#FFC107">
      <rect x="1" y="0" width="1" height="1"></rect>
      <rect x="0" y="1" width="3" height="1"></rect>
      <rect x="1" y="2" width="1" height="1"></rect>
    </g>
  </defs>

  
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"></rect>

  
  <g class="body-anim-rot">
      
      
      <g id="legs" fill="#DE886D">
        <rect id="outer-left-leg" x="3" y="13" width="1" height="2"></rect>
        <rect id="inner-left-leg" x="5" y="13" width="1" height="2"></rect>
        <rect id="inner-right-leg" x="9" y="13" width="1" height="2"></rect>
        <rect id="outer-right-leg" x="11" y="13" width="1" height="2"></rect>
      </g>

      
      <g id="body-color-group" fill="#DE886D">
        <rect id="torso" x="2" y="6" width="11" height="7"></rect>
        <rect id="left-arm" x="0" y="9" width="2" height="2"></rect>
        <rect id="right-arm" x="13" y="9" width="2" height="2"></rect>
      </g>
      

      
      <g id="eyes-color-group" fill="#000000">
        
        <rect id="left-eye" x="4" y="8" width="1" height="1"></rect>
        <rect id="right-eye" x="10" y="8" width="1" height="1"></rect>
        
        
        <rect x="3" y="7" width="1" height="1"></rect>
        <rect x="5" y="7" width="1" height="1"></rect>
        <rect x="3" y="9" width="1" height="1"></rect>
        <rect x="5" y="9" width="1" height="1"></rect>

        
        <rect x="9" y="7" width="1" height="1"></rect>
        <rect x="11" y="7" width="1" height="1"></rect>
        <rect x="9" y="9" width="1" height="1"></rect>
        <rect x="11" y="9" width="1" height="1"></rect>
      </g>
    </g>

  
  <g transform="translate(7.5, 2)">
    <g class="star star-1"><use href="#pixel-star" transform="translate(-1.5, -1.5)"></use></g>
    <g class="star star-2"><use href="#pixel-star" transform="translate(-1.5, -1.5)"></use></g>
    <g class="star star-3"><use href="#pixel-star" transform="translate(-1.5, -1.5)"></use></g>
  </g>
</svg>