<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 -9 24 25.5" width="240" height="255" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    
    
    
    <g id="pixel-packet">
      <rect x="0" y="0" width="1.5" height="1.5"></rect>
    </g>
  </defs>

  
  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"></rect>

  
  <g class="data-particles" fill="#40C4FF">
    <use href="#pixel-packet" class="data-bit d1" x="-2" y="12"></use>
    <use href="#pixel-packet" class="data-bit d2" x="5" y="11"></use>
    <use href="#pixel-packet" class="data-bit d3" x="12" y="13"></use>
    <use href="#pixel-packet" class="data-bit d4" x="17" y="11"></use>
    <use href="#pixel-packet" class="data-bit d5" x="8" y="10"></use>
    <use href="#pixel-packet" class="data-bit d6" x="1" y="11"></use>
    <use href="#pixel-packet" class="data-bit d7" x="15" y="12"></use>
  </g>

  
  <g class="body-jitter">
    
    
    <g id="body-color-group" fill="#DE886D">
      
      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"></rect>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"></rect>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"></rect>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"></rect>

      
      <rect id="torso" x="2" y="6" width="11" height="7"></rect>
      
      
      <g class="arm-l-type">
        <rect id="left-arm" x="0" y="9" width="2" height="2"></rect>
      </g>
      <g class="arm-r-type">
        <rect id="right-arm" x="13" y="9" width="2" height="2"></rect>
      </g>
    </g>
    
    
    <g fill="#000000">
      <g class="eyes-read">
        <rect id="left-eye-squint" x="4" y="8.5" width="1" height="1"></rect>
        <rect id="right-eye-squint" x="10" y="8.5" width="1" height="1"></rect>
      </g>
    </g>
    
  </g>

  
  <g id="laptop" transform="translate(3, 9.5)">
    
    <rect x="-0.5" y="5" width="10" height="1" fill="#546E7A" rx="0.5"></rect>
    
    <rect x="0" y="0" width="9" height="5.5" fill="#78909C" rx="0.5"></rect>
    
    <circle cx="4.5" cy="2.5" r="1.5" fill="#40C4FF" opacity="0.2" class="logo-glow"></circle>
    <rect x="4" y="2" width="1" height="1" fill="#FFFFFF" class="logo-glow"></rect>
  </g>

</svg>