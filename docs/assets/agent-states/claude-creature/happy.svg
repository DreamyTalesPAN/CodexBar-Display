<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 -9 24 25.5" width="240" height="255" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    

    
    <g id="px-sparkle">
      
      <rect class="spark-center" x="-0.5" y="-0.5" width="1" height="1"></rect>
      
      <path class="spark-outer" d="M -0.5,-1.5 h1 v1 h-1 z                                     M -0.5,0.5 h1 v1 h-1 z                                     M -1.5,-0.5 h1 v1 h-1 z                                     M 0.5,-0.5 h1 v1 h-1 z"></path>
    </g>
  </defs>

  
  <rect id="ground-shadow" class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000"></rect>

  
  <g class="sparkles">
    <use href="#px-sparkle" x="-4" y="-2" fill="#FFD700" style="--delay: 0.0s"></use>
    <use href="#px-sparkle" x="18" y="-4" fill="#FFA000" style="--delay: 0.3s"></use>
    <use href="#px-sparkle" x="20" y="10" fill="#FFF59D" style="--delay: 0.6s"></use>
    <use href="#px-sparkle" x="-6" y="12" fill="#FFC107" style="--delay: 0.9s"></use>
    <use href="#px-sparkle" x="7" y="-8" fill="#FFF59D" style="--delay: 1.2s"></use>
    <use href="#px-sparkle" x="-2" y="6" fill="#FFD700" style="--delay: 0.7s"></use>
  </g>

  
  <g class="bounce-anim">
    
    <g id="body-color-group" fill="#DE886D">
      
      <rect id="outer-left-leg" x="3" y="13" width="1" height="2"></rect>
      <rect id="inner-left-leg" x="5" y="13" width="1" height="2"></rect>
      <rect id="inner-right-leg" x="9" y="13" width="1" height="2"></rect>
      <rect id="outer-right-leg" x="11" y="13" width="1" height="2"></rect>

      
      <rect id="torso" x="2" y="6" width="11" height="7"></rect>
      
      
      <g class="arm-l">
        <rect id="left-arm" x="0" y="9" width="2" height="2"></rect>
      </g>
      <g class="arm-r">
        <rect id="right-arm" x="13" y="9" width="2" height="2"></rect>
      </g>
    </g>
    
    
    <g class="eyes-blink" fill="#000000">
      <rect id="left-eye" x="4" y="8" width="1" height="2"></rect>
      <rect id="right-eye" x="10" y="8" width="1" height="2"></rect>
    </g>
  </g>
</svg>