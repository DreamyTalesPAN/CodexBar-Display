name: CODEX Prepare and Release VibeTV
run-name: CODEX VibeTV v${{ inputs.version }} (${{ inputs.firmware }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final public Mac App SemVer built from the exact main SHA
        required: true
        type: string
      firmware:
        description: Keep public firmware versions or bump every board by one patch
        required: true
        default: unchanged
        type: choice
        options:
          - unchanged
          - bump

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-vibetv-release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-main:
    needs: resolve-baselines
    if: >-
      github.repository == 'DreamyTalesPAN/CodexBar-Display' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == github.repository_owner || github.actor == 'marcus7989')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: CODEX-vibetv-rc-baselines-${{ github.run_id }}
          path: tmp/vibetv-baselines
      - name: Build immutable candidate inputs once
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo 'version must be SemVer' >&2; exit 1; }
          test -d companion/cmd/virtual-vibetv || { echo 'error: Issue #177 Core is required: companion/cmd/virtual-vibetv is missing.' >&2; exit 1; }
          pip install platformio intelhex
          mkdir -p dist/macos tmp/vibetv-rc/publish/companion tmp/vibetv-rc/publish/firmware tmp/vibetv-rc/test
          (
            cd apps/control-center
            npm ci
            npm run build:local
          )
          rm -rf companion/internal/companionapi/controlcenter_static
          mkdir -p companion/internal/companionapi/controlcenter_static
          cp -R apps/control-center/out-local/. companion/internal/companionapi/controlcenter_static/
          (
            cd companion
            for arch in amd64 arm64; do
              GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build \
                -ldflags "-s -w -X github.com/DreamyTalesPAN/CodexBar-Display/companion/internal/buildinfo.Version=${version} -X github.com/DreamyTalesPAN/CodexBar-Display/companion/internal/buildinfo.Commit=${GITHUB_SHA}" \
                -o "../tmp/vibetv-rc/codexbar-display-${arch}" ./cmd/codexbar-display
            done
            for arch in amd64 arm64; do GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -o "../tmp/vibetv-rc/virtual-vibetv-${arch}" ./cmd/virtual-vibetv; done
          )
          lipo -create -output tmp/vibetv-rc/codexbar-display tmp/vibetv-rc/codexbar-display-amd64 tmp/vibetv-rc/codexbar-display-arm64
          lipo -create -output tmp/vibetv-rc/virtual-vibetv tmp/vibetv-rc/virtual-vibetv-amd64 tmp/vibetv-rc/virtual-vibetv-arm64
          cp tmp/vibetv-rc/codexbar-display tmp/vibetv-rc/test/codexbar-display
          cp tmp/vibetv-rc/virtual-vibetv tmp/vibetv-rc/test/virtual-vibetv
          for arch in amd64 arm64; do cp "tmp/vibetv-rc/codexbar-display-${arch}" "tmp/vibetv-rc/publish/companion/codexbar-display-darwin-${arch}-v${version}"; done
          cp scripts/install.sh tmp/vibetv-rc/publish/install.sh
          cp scripts/install-control-center-companion-release.sh tmp/vibetv-rc/publish/install-control-center-companion.sh
          chmod +x tmp/vibetv-rc/publish/install*.sh
          ./scripts/build-macos-control-center-app.sh --version "$version" --build "$GITHUB_RUN_ID" --universal --companion-binary tmp/vibetv-rc/codexbar-display --output 'dist/macos/VibeTV Control Center.app'
          COPYFILE_DISABLE=1 tar -czf tmp/vibetv-rc/app.tar.gz -C dist/macos 'VibeTV Control Center.app'
          firmware_config=tmp/vibetv-baselines/effective-firmware-versions.json
          python3 - "$firmware_config" > tmp/vibetv-rc/firmware-targets.tsv <<'PY'
          import json, sys
          for item in json.load(open(sys.argv[1]))["artifacts"]:
              env, board, fw = item["firmwareEnv"], item["board"], item["firmwareVersion"]
              source = item["artifactSource"]
              if source == "public": asset, expected = item["asset"], item["sha256"]
              elif source == "build" and env == "esp8266_smalltv_st7789": asset, expected = f"codexbar-display-firmware-{env}-v{fw}.bin.gz", "-"
              elif source == "build" and env == "lilygo_t_display_s3": asset, expected = f"codexbar-display-firmware-{env}-v{fw}.bin", "-"
              else: raise SystemExit(f"unsupported firmware target: {env} from {source}")
              directory = "firmware_esp8266" if env == "esp8266_smalltv_st7789" else "firmware_esp32"
              print("\t".join((directory, env, board, fw, asset, source, expected)))
          PY
          while IFS=$'\t' read -r dir env board fw asset artifact_source expected_sha; do
            destination="tmp/vibetv-rc/publish/firmware/$asset"
            if [[ "$artifact_source" == public ]]; then
              source="tmp/vibetv-baselines/baselines/current_public.firmware/$asset"
              test -f "$source" || { echo "missing frozen public firmware: $asset" >&2; exit 1; }
              [[ "$(shasum -a 256 "$source" | awk '{print $1}')" == "$expected_sha" ]] \
                || { echo "frozen public firmware checksum mismatch: $asset" >&2; exit 1; }
              cp "$source" "$destination"
            else
              BUILD_LOG="$(mktemp)"
              (cd "$dir" && CODEXBAR_DISPLAY_FW_VERSION="$fw" pio run -e "$env") 2>&1 | tee "$BUILD_LOG"
              source="$dir/.pio/build/$env/firmware.bin"
              if [[ "$env" == esp8266_* ]]; then
                ./scripts/check-firmware-size-budget.sh "$BUILD_LOG" "$source" "$env" 47 82 489000 350000
                gzip -c -9 "$source" > "$destination"
              else
                ./scripts/check-firmware-size-budget.sh "$BUILD_LOG" "$source" "$env" 47 82 0 0
                cp "$source" "$destination"
              fi
            fi
          done < tmp/vibetv-rc/firmware-targets.tsv
          python3 - "$version" "$GITHUB_REPOSITORY" "$firmware_config" tmp/vibetv-rc/firmware-targets.tsv tmp/vibetv-rc/publish/firmware > tmp/vibetv-rc/publish/firmware/firmware-manifest.json <<'PY'
          import hashlib, json, os, sys
          version, repo, config_path, targets, root = sys.argv[1:]
          config=json.load(open(config_path, encoding="utf-8"))
          configured={item["firmwareEnv"]: item for item in config["artifacts"]}
          entries=[]
          for line in open(targets, encoding="utf-8"):
              _, env, board, fw, asset, _, _ = line.rstrip("\n").split("\t")
              data=open(os.path.join(root, asset), "rb").read()
              item=configured[env]
              entries.append({"firmwareEnv":env,"board":board,"firmwareVersion":fw,"asset":asset,"sha256":hashlib.sha256(data).hexdigest(),"severity":item.get("severity", "recommended"),"message":item.get("message", ""),"firmwareUrl":f"https://github.com/{repo}/releases/download/v{version}/{asset}"})
          json.dump({"schemaVersion":1,"release":"v"+version,"protocolVersion":config.get("protocolVersion", 1),"artifacts":entries}, sys.stdout, indent=2); print()
          PY
          cp tmp/vibetv-rc/publish/firmware/firmware-manifest.json "tmp/vibetv-rc/publish/firmware/firmware-manifest-v${version}.json"
          printf '%s\n' "$version" > tmp/vibetv-rc/version.txt
          printf '%s\n' "$GITHUB_SHA" > tmp/vibetv-rc/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CODEX-vibetv-rc-inputs-${{ github.run_id }}
          path: tmp/vibetv-rc
          retention-days: 30

  build-windows:
    needs: resolve-baselines
    if: >-
      github.repository == 'DreamyTalesPAN/CodexBar-Display' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == github.repository_owner || github.actor == 'marcus7989')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      # Azure Artifact Signing authenticates through OIDC federation on main,
      # so the job mints its own short-lived token and no client secret exists.
      id-token: write
    env:
      CGO_ENABLED: '0'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Build the Control Center UI bundled into the Companion
        shell: pwsh
        run: |
          Push-Location apps/control-center
          npm ci
          npm run build:local
          Pop-Location
          $static = "companion/internal/companionapi/controlcenter_static"
          if (Test-Path $static) { Remove-Item -Recurse -Force $static }
          New-Item -ItemType Directory -Path $static | Out-Null
          Copy-Item -Recurse -Path "apps/control-center/out-local/*" -Destination $static
      - name: "Build the Companion sidecar (no console window: the Scheduled Task runs it interactively)"
        working-directory: companion
        env:
          GOOS: windows
          GOARCH: amd64
          VIBETV_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VIBETV_VERSION -replace '^v', ''
          go build -trimpath -ldflags "-s -w -H=windowsgui -X github.com/DreamyTalesPAN/CodexBar-Display/companion/internal/buildinfo.Version=$version -X github.com/DreamyTalesPAN/CodexBar-Display/companion/internal/buildinfo.Commit=$env:GITHUB_SHA" -o ../windows/src-tauri/binaries/codexbar-display-x86_64-pc-windows-msvc.exe ./cmd/codexbar-display
      - name: Extract the pinned CodexBar CLI sidecar
        shell: pwsh
        run: ./scripts/fetch-win-codexbar.ps1 -Destination "$env:RUNNER_TEMP/win-codexbar"
      - name: Bundle pinned agent observer and corresponding source
        shell: pwsh
        run: python integrations/clawd/prepare.py --platform win-x64 --output windows/src-tauri/agent-engine
      - name: Stage the CodexBar CLI sidecar
        shell: pwsh
        run: Copy-Item $env:CODEXBAR_CONTRACT_BIN windows/src-tauri/binaries/codexbar-cli-x86_64-pc-windows-msvc.exe
      - name: Make the sidecars writable so signing can rewrite them
        shell: pwsh
        # The extracted CodexBar CLI keeps the read-only flag from its archive.
        # Tauri reports that as the misleading "failed to run <tool>" instead of
        # a permission error, so clear it before signing touches the binaries.
        run: |
          Get-ChildItem windows/src-tauri/binaries -Filter *.exe | ForEach-Object {
            Set-ItemProperty -Path $_.FullName -Name IsReadOnly -Value $false
          }
      - name: Sign in to Azure for Artifact Signing
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Install the Microsoft signing CLI
        shell: pwsh
        run: |
          # The package is still shipped as prerelease only.
          dotnet tool install --global sign --prerelease
          if ($LASTEXITCODE -ne 0) { throw "could not install the signing CLI" }
      - name: Prove signing works before the long build
        shell: pwsh
        env:
          VIBETV_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          VIBETV_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          VIBETV_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        # Tauri swallows the signing tool's output and only reports "failed to
        # run <tool>", which hides the actual cause behind a five-minute build.
        # Signing a throwaway copy first surfaces the real error immediately.
        run: |
          $probe = "$env:RUNNER_TEMP/sign-probe.exe"
          Copy-Item windows/src-tauri/binaries/codexbar-display-x86_64-pc-windows-msvc.exe $probe
          Set-ItemProperty -Path $probe -Name IsReadOnly -Value $false
          $signHelp = (& sign code --help 2>&1 | Out-String)
          if ($signHelp -match 'artifact-signing') {
            $verb = 'artifact-signing'
          } elseif ($signHelp -match 'trusted-signing') {
            $verb = 'trusted-signing'
          } else {
            throw "the signing CLI exposes neither artifact-signing nor trusted-signing."
          }
          "resolved signing subcommand: $verb" | Write-Host
          & sign code $verb `
            "--$verb-endpoint" $env:VIBETV_SIGNING_ENDPOINT `
            "--$verb-account" $env:VIBETV_SIGNING_ACCOUNT `
            "--$verb-certificate-profile" $env:VIBETV_SIGNING_PROFILE `
            --timestamp-url "http://timestamp.acs.microsoft.com" `
            --verbosity information `
            $probe
          if ($LASTEXITCODE -ne 0) {
            throw "the signing CLI rejected a probe file (exit $LASTEXITCODE); see the output above."
          }
          $probeSignature = Get-AuthenticodeSignature -FilePath $probe
          if ($probeSignature.Status -ne 'Valid') {
            throw "the probe file is not validly signed (status: $($probeSignature.Status))."
          }
          "probe signed by: $($probeSignature.SignerCertificate.Subject)" | Write-Host
      - name: Build and sign the release NSIS installer
        working-directory: windows/src-tauri
        env:
          VIBETV_BUILD: ${{ github.run_id }}
          VIBETV_VERSION: ${{ inputs.version }}
          VIBETV_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          VIBETV_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          VIBETV_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          # azure/login only primes the Azure CLI session; DefaultAzureCredential
          # inside the signing CLI still needs to be pointed at the same identity.
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          # The updater signature the released shell verifies against the
          # public key pinned in tauri.conf.json. Unlike CI, this workflow only
          # ever builds the reviewed main SHA, so the release key is safe here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required: without it no released shell can accept the update."
          }
          foreach ($name in @('VIBETV_SIGNING_ENDPOINT', 'VIBETV_SIGNING_ACCOUNT', 'VIBETV_SIGNING_PROFILE')) {
            if (-not (Get-Item -Path "env:$name" -ErrorAction SilentlyContinue).Value) {
              throw "$name is required: a released installer must carry an Authenticode signature."
            }
          }
          $version = $env:VIBETV_VERSION -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "version must be SemVer"
          }
          cargo install tauri-cli --version "^2" --locked
          # Authenticode signing happens through the bundler, not afterwards:
          # Tauri derives the updater signature from the finished installer, so
          # signing it later would invalidate that signature and every installed
          # shell would reject the update. Keeping signCommand out of the
          # committed config also keeps local and CI builds working without the
          # Azure CLI.
          # Tauri spawns signCommand as a raw process without a shell and splits
          # it on spaces, so the program must be an absolute path that contains
          # none. The dotnet global tool qualifies; a pwsh wrapper does not,
          # because pwsh.exe lives under "C:\Program Files".
          $signExe = (Get-Command sign -ErrorAction Stop).Source -replace '\\', '/'
          if ($signExe -match ' ') {
            throw "the signing CLI path contains a space, which Tauri cannot invoke: $signExe"
          }
          # Microsoft is renaming this subcommand from trusted-signing to
          # artifact-signing, and both spellings are in the wild. Ask the
          # installed CLI which one it knows instead of pinning a guess.
          $signHelp = (& sign code --help 2>&1 | Out-String)
          if ($signHelp -match 'artifact-signing') {
            $signVerb = 'artifact-signing'
          } elseif ($signHelp -match 'trusted-signing') {
            $signVerb = 'trusted-signing'
          } else {
            throw "the signing CLI exposes neither artifact-signing nor trusted-signing."
          }
          # Azure Artifact Signing issues certificates that expire within hours,
          # so an RFC 3161 timestamp is what keeps the signature valid after the
          # release.
          $signArgs = @(
            "code", $signVerb,
            "--$signVerb-endpoint", $env:VIBETV_SIGNING_ENDPOINT,
            "--$signVerb-account", $env:VIBETV_SIGNING_ACCOUNT,
            "--$signVerb-certificate-profile", $env:VIBETV_SIGNING_PROFILE,
            "--timestamp-url", "http://timestamp.acs.microsoft.com",
            "--verbosity", "information"
          ) -join ' '
          $releaseConfig = [ordered]@{
            version = $version
            bundle = [ordered]@{
              windows = [ordered]@{
                signCommand = "$signExe $signArgs %1"
              }
            }
          }
          Set-Content -Path "$env:RUNNER_TEMP/release-version.json" -Value ($releaseConfig | ConvertTo-Json -Depth 6 -Compress)
          cargo tauri build --bundles nsis --config "$env:RUNNER_TEMP/release-version.json"
      - name: Stage the Windows publish set
        shell: pwsh
        env:
          VIBETV_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:VIBETV_VERSION -replace '^v', ''
          $bundle = "windows/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundle -Filter *.exe | Select-Object -First 1
          $signature = Get-ChildItem -Path $bundle -Filter *.exe.sig | Select-Object -First 1
          if (-not $installer -or -not $signature) {
            throw "the NSIS build produced no installer or no updater signature"
          }
          # Prove the Authenticode signature really landed. Tauri does not fail
          # the build when signCommand leaves the file untouched, so without this
          # check an unsigned installer would ship and SmartScreen would warn
          # every customer.
          $authenticode = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($authenticode.Status -ne 'Valid') {
            throw "the installer is not validly signed (status: $($authenticode.Status))"
          }
          if ($authenticode.SignerCertificate.Subject -notmatch 'DreamyTales') {
            throw "the installer was signed by an unexpected certificate: $($authenticode.SignerCertificate.Subject)"
          }
          Write-Host "Authenticode signer: $($authenticode.SignerCertificate.Subject)"
          # The same unversioned name the Mac DMG uses, so the download page
          # can link to releases/latest/download/<asset> without knowing the
          # version. The release tag already identifies the version.
          $asset = "VibeTV-Control-Center-Setup.exe"
          New-Item -ItemType Directory -Force -Path tmp/vibetv-rc-windows | Out-Null
          Copy-Item $installer.FullName "tmp/vibetv-rc-windows/$asset"
          # The Updates tab fetches this manifest from the latest release and
          # verifies the signature against the pinned public key before it runs
          # the installer in passive mode.
          $manifest = [ordered]@{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $signature.FullName -Raw).Trim()
                url = "https://github.com/$env:REPOSITORY/releases/download/v$version/$asset"
              }
            }
          }
          Set-Content -Path tmp/vibetv-rc-windows/latest-windows.json -Encoding utf8 -Value ($manifest | ConvertTo-Json -Depth 5)
      - uses: actions/upload-artifact@v4
        with:
          name: CODEX-vibetv-rc-windows-${{ github.run_id }}
          path: tmp/vibetv-rc-windows
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  sign-and-package:
    needs: [build-main, build-windows]
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CODEX-vibetv-rc-inputs-${{ github.run_id }}
          path: tmp/vibetv-rc
      - uses: actions/download-artifact@v4
        with:
          name: CODEX-vibetv-rc-windows-${{ github.run_id }}
          path: tmp/vibetv-rc-windows
      - run: ./scripts/extract-vibetv-candidate-app.sh --archive tmp/vibetv-rc/app.tar.gz --output dist/macos
      - name: Sign and notarize immutable release candidate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          ./scripts/sign-notarize-macos-control-center.sh --app 'dist/macos/VibeTV Control Center.app' --sign-app-only --allow-internal-xprotect-preflight-error
          ./scripts/build-macos-control-center-dmg.sh --app 'dist/macos/VibeTV Control Center.app' --output dist/macos/VibeTV-Control-Center.dmg --staging-dir tmp/vibetv-rc/dmg-stage
          ./scripts/sign-notarize-macos-control-center.sh --app 'dist/macos/VibeTV Control Center.app' --dmg dist/macos/VibeTV-Control-Center.dmg --skip-app-sign --notary-log tmp/vibetv-rc/test/notarization-log.json
          ./scripts/verify-macos-control-center-dmg.sh --dmg dist/macos/VibeTV-Control-Center.dmg
      - name: Create immutable production publish set and candidate manifest
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(cat tmp/vibetv-rc/version.txt)"
          source_sha="$(cat tmp/vibetv-rc/source-sha.txt)"
          sparkle_dir="$(./scripts/fetch-sparkle.sh)"
          mkdir -p tmp/vibetv-rc/publish/macos
          # Signing rewrote the embedded helper, and the guest matrix proves the
          # DMG ships the exact tested companion byte for byte — stage the
          # signed helper as the test companion (same step as the merge gate).
          cp 'dist/macos/VibeTV Control Center.app/Contents/Helpers/codexbar-display' tmp/vibetv-rc/test/codexbar-display
          cp dist/macos/VibeTV-Control-Center.dmg tmp/vibetv-rc/publish/macos/VibeTV-Control-Center.dmg
          # The Windows installer and its updater manifest were built and
          # signed from the same main SHA; they join the immutable publish set
          # before the checksums are frozen, so the publish gate and the
          # byte-identical public verification cover them too.
          mkdir -p tmp/vibetv-rc/publish/windows
          cp tmp/vibetv-rc-windows/latest-windows.json tmp/vibetv-rc/publish/windows/latest-windows.json
          cp tmp/vibetv-rc-windows/VibeTV-Control-Center-Setup.exe tmp/vibetv-rc/publish/windows/VibeTV-Control-Center-Setup.exe
          python3 - "$version" "$REPOSITORY" tmp/vibetv-rc/publish/windows <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          version, repository, root = sys.argv[1:]
          root = Path(root)
          asset = "VibeTV-Control-Center-Setup.exe"
          manifest = json.loads((root / "latest-windows.json").read_text(encoding="utf-8"))
          platform = manifest["platforms"]["windows-x86_64"]
          expected = f"https://github.com/{repository}/releases/download/v{version}/{asset}"
          if manifest["version"] != version or platform["url"] != expected:
              raise SystemExit("latest-windows.json does not describe this release asset")
          if not platform["signature"].strip():
              raise SystemExit("latest-windows.json has no updater signature")
          if not (root / asset).is_file():
              raise SystemExit("the Windows installer asset is missing")
          print("windows publish set ok", hashlib.sha256((root / asset).read_bytes()).hexdigest())
          PY
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" --ed-key-file - --maximum-deltas 0 --link https://app.vibetv.shop --download-url-prefix "https://github.com/${REPOSITORY}/releases/download/v${version}/" -o tmp/vibetv-rc/publish/macos/appcast.xml tmp/vibetv-rc/publish/macos
          (cd tmp/vibetv-rc/publish && find . -type f ! -name "checksums-*" -print0 | sort -z | xargs -0 shasum -a 256 > "checksums-v${version}.txt")
          (cd tmp/vibetv-rc/publish && shasum -a 256 -c "checksums-v${version}.txt")
          python3 - "$source_sha" "$version" "$REPOSITORY" "$CANDIDATE_RUN_ID" tmp/vibetv-rc/candidate-manifest.json tmp/vibetv-rc <<'PY'
          import datetime, hashlib, json, sys
          sha, version, repository, run_id, output, root = sys.argv[1:]
          from pathlib import Path
          files = sorted(Path(root).glob("publish/**/*")) + sorted(Path(root).glob("test/**/*"))
          artifacts = []
          for path in files:
              if not path.is_file(): continue
              relative = path.relative_to(root).as_posix()
              role = "firmware" if "/firmware/" in relative and relative.endswith((".bin", ".gz")) else "firmware-manifest" if "firmware-manifest" in relative else "signed-dmg" if relative.endswith(".dmg") else "sparkle-appcast" if relative.endswith("appcast.xml") else "windows-installer" if relative.endswith(".exe") else "windows-update-manifest" if relative.endswith("latest-windows.json") else "notarization-evidence" if relative.endswith("notarization-log.json") else "installer" if relative.endswith(".sh") else "companion-arch" if "/companion/" in relative else "checksums" if "checksums-" in relative else "virtual-vibetv" if relative.endswith("virtual-vibetv") else "companion"
              artifacts.append({"name": path.name, "path": relative, "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "role": role, "publish": relative.startswith("publish/")})
          with open(output, "w", encoding="utf-8") as destination:
              json.dump({
                  "schemaVersion": 1, "repository": repository, "sourceSha": sha, "version": version,
                  "candidateRunId": run_id,
                  "createdAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
                  "artifacts": artifacts, "virtualGate": {"result": "pending", "runId": run_id},
              }, destination, indent=2)
              destination.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vibetv-release-candidate
          path: |
            tmp/vibetv-rc/publish
            tmp/vibetv-rc/test
            tmp/vibetv-rc/candidate-manifest.json
          retention-days: 30
          compression-level: 0

  resolve-baselines:
    if: >-
      github.repository == 'DreamyTalesPAN/CodexBar-Display' &&
      github.ref == 'refs/heads/main' &&
      (github.actor == github.repository_owner || github.actor == 'marcus7989')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require a real manual Production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required_reviewers="$(
            gh api "repos/${GITHUB_REPOSITORY}/environments/Production" \
              --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length'
          )"
          [[ "$required_reviewers" == 1 ]] || {
            echo 'error: Production must have a required reviewer before preparing a release' >&2
            exit 1
          }
      - name: Resolve current and previous public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-vibetv-public-baselines.sh --output baseline-manifest.json
      - name: Freeze baseline bytes, hashes, and final firmware versions
        env:
          FIRMWARE_MODE: ${{ inputs.firmware }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - baseline-manifest.json <<'PY'
          import hashlib, json, pathlib, urllib.request
          import sys
          path = pathlib.Path(sys.argv[1])
          manifest = json.loads(path.read_text())
          root = pathlib.Path('baselines'); root.mkdir()
          for state, baseline in manifest['baselines'].items():
              for kind, url_key in [('dmg', 'dmgUrl'), ('appcast', 'appcastUrl'), ('firmware-manifest', 'firmwareManifestUrl')]:
                  data = urllib.request.urlopen(baseline[url_key]).read()
                  target = root / f'{state}.{ "dmg" if kind == "dmg" else "appcast.xml" if kind == "appcast" else "firmware-manifest.json" }'
                  target.write_bytes(data)
                  baseline[kind + 'Sha256'] = hashlib.sha256(data).hexdigest()
              firmware = json.loads((root / f'{state}.firmware-manifest.json').read_text())
              esp = next(item for item in firmware['artifacts'] if item['firmwareEnv'] == 'esp8266_smalltv_st7789')
              baseline['esp8266FirmwareVersion'] = esp['firmwareVersion']
              baseline['esp8266FirmwareSha256'] = esp['sha256']
              if state == 'current_public':
                  firmware_root = root / 'current_public.firmware'; firmware_root.mkdir()
                  for item in firmware['artifacts']:
                      asset = item['asset']
                      if not asset or any(char in asset for char in '\t\r\n') or pathlib.Path(asset).name != asset:
                          raise SystemExit('unsafe public firmware asset: ' + asset)
                      data = urllib.request.urlopen(item['firmwareUrl']).read()
                      digest = hashlib.sha256(data).hexdigest()
                      if digest != item['sha256']:
                          raise SystemExit('public firmware checksum mismatch: ' + asset)
                      (firmware_root / asset).write_bytes(data)
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          python3 scripts/validate-release-publish-gate.py resolve-versions \
            --baseline-manifest baseline-manifest.json \
            --current-firmware-manifest baselines/current_public.firmware-manifest.json \
            --defaults release/firmware-versions.json \
            --release-version "$VERSION" \
            --firmware-mode "$FIRMWARE_MODE" \
            --output effective-firmware-versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: CODEX-vibetv-rc-baselines-${{ github.run_id }}
          path: |
            baseline-manifest.json
            effective-firmware-versions.json
            baselines
          retention-days: 30

  guest-test:
    needs: [sign-and-package, resolve-baselines]
    runs-on: macos-15
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        state: [clean_os, current_public, previous_public]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vibetv-release-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: CODEX-vibetv-rc-baselines-${{ github.run_id }}
          path: baselines
      - name: Download frozen public baseline when required
        if: matrix.state != 'clean_os'
        run: |
          python3 - "baselines/baseline-manifest.json" "${{ matrix.state }}" <<'PY' > baseline.env
          import json, shlex, sys
          baseline = json.load(open(sys.argv[1], encoding="utf-8"))["baselines"][sys.argv[2]]
          print("DMG_URL=" + shlex.quote(baseline["dmgUrl"]))
          print("APPCAST_URL=" + shlex.quote(baseline["appcastUrl"]))
          PY
          cp "baselines/baselines/${{ matrix.state }}.dmg" baseline.dmg
          cp "baselines/baselines/${{ matrix.state }}.appcast.xml" baseline-appcast.xml
          cp "baselines/baselines/${{ matrix.state }}.firmware-manifest.json" baseline-firmware-manifest.json
          shasum -a 256 baseline.dmg baseline-appcast.xml
      - name: Run full direct hosted macOS guest matrix
        run: |
          set -euo pipefail
          # actions/download-artifact strips the executable bit; the harness
          # refuses non-executable helper binaries (same chmod as the merge gate).
          chmod +x candidate/test/virtual-vibetv candidate/test/codexbar-display
          version="$(python3 -c 'import json; print(json.load(open("candidate/candidate-manifest.json"))["version"])')"
          baseline_args=()
          current_firmware=0.0.0
          if [[ '${{ matrix.state }}' != clean_os ]]; then
            baseline_args=(--baseline-dmg baseline.dmg --baseline-appcast baseline-appcast.xml)
            current_firmware="$(python3 -c 'import json; print(next(a["firmwareVersion"] for a in json.load(open("baseline-firmware-manifest.json"))["artifacts"] if a["firmwareEnv"] == "esp8266_smalltv_st7789"))')"
          fi
          firmware_asset="$(python3 -c 'import json; print(next(a["asset"] for a in json.load(open("candidate/publish/firmware/firmware-manifest.json"))["artifacts"] if a["firmwareEnv"] == "esp8266_smalltv_st7789"))')"
          ./scripts/test-vibetv-hosted-guest.sh --dmg candidate/publish/macos/VibeTV-Control-Center.dmg --appcast candidate/publish/macos/appcast.xml --virtual-vibetv candidate/test/virtual-vibetv --companion candidate/test/codexbar-display --firmware "candidate/publish/firmware/$firmware_asset" --firmware-manifest candidate/publish/firmware/firmware-manifest.json --current-firmware "$current_firmware" --version "$version" --state '${{ matrix.state }}' --output 'results/${{ matrix.state }}' "${baseline_args[@]+"${baseline_args[@]}"}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CODEX-vibetv-rc-results-${{ matrix.state }}-${{ github.run_id }}
          path: results
          retention-days: 30

  aggregate-result:
    if: always()
    needs: [sign-and-package, guest-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibetv-release-candidate
          path: candidate
      - name: Write immutable candidate result
        env:
          MATRIX_RESULT: ${{ needs.guest-test.result }}
        run: |
          python3 - "candidate/candidate-manifest.json" candidate-result.json "$MATRIX_RESULT" <<'PY'
          import json, sys
          manifest_path, output, matrix_result = sys.argv[1:]
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          result = "success" if matrix_result == "success" else "failure"
          with open(output, "w", encoding="utf-8") as destination:
              json.dump({
                  "schemaVersion": 1,
                  "repository": manifest["repository"],
                  "sourceSha": manifest["sourceSha"],
                  "version": manifest["version"],
                  "candidateRunId": manifest["candidateRunId"],
                  "result": result,
                  "artifactHashes": {item["path"]: item["sha256"] for item in manifest["artifacts"]},
              }, destination, indent=2)
              destination.write("\n")
          if result != "success":
              raise SystemExit("candidate matrix did not pass; result artifact is intentionally non-publishable")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibetv-release-candidate-result
          path: candidate-result.json
          retention-days: 30

  publish-release:
    needs: aggregate-result
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
