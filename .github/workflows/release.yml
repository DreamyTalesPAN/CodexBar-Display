name: CODEX Publish Prepared VibeTV Candidate

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the candidate's trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the immutable candidate and automated result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vibetv-release-candidate*
          path: downloaded

      - name: Validate and freeze the exact publish payload
        run: |
          python3 scripts/validate-release-publish-gate.py prepare \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --candidate-run-id "${GITHUB_RUN_ID}" \
            --candidate-dir downloaded/vibetv-release-candidate \
            --candidate-result downloaded/vibetv-release-candidate-result/candidate-result.json \
            --output validated/publish-payload.json \
            --copy-dir validated/assets

      - name: Upload the validated publish payload for Production approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibetv-validated-publish
          path: validated
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    concurrency:
      group: codex-vibetv-production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the exact candidate source before staging assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the approved candidate payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vibetv-validated-publish
          path: validated

      - name: Read immutable release identity
        id: identity
        run: |
          python3 - validated/publish-payload.json >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"version={payload['version']}")
          print(f"source_sha={payload['sourceSha']}")
          PY

      - name: Reject stale or conflicting release identity
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          current_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          python3 - "$VERSION" "${current_tag#v}" <<'PY'
          import re, sys
          candidate, current = sys.argv[1:]
          semver = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          def parse(value):
              match = semver.fullmatch(value)
              if not match: raise SystemExit(f"invalid public release SemVer: {value}")
              return tuple(int(part) for part in match.groups())
          if parse(candidate) <= parse(current):
              raise SystemExit(f"candidate v{candidate} is no longer newer than public v{current}")
          PY
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "error: tag v${VERSION} already exists" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "error: release v${VERSION} already exists" >&2
            exit 1
          fi

      - name: Create the exact GitHub tag and release without rebuilding
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -d '' release_files < <(
            find validated/assets -type f -print0 | sort -z
          )
          (( ${#release_files[@]} > 0 )) \
            || { echo "error: validated candidate assets are missing" >&2; exit 1; }
          gh release create "v${VERSION}" "${release_files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest

      - name: Download the public release assets
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir published

      - name: Verify public assets are byte-identical to the candidate
        run: |
          python3 - validated/publish-payload.json published <<'PY'
          import hashlib, json, pathlib, sys
          payload_path, published_root = sys.argv[1:]
          payload = json.loads(pathlib.Path(payload_path).read_text(encoding="utf-8"))
          expected = {item["name"]: item["sha256"] for item in payload["artifacts"]}
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path(published_root).iterdir()
              if path.is_file()
          }
          if actual != expected:
              raise SystemExit("published release assets do not exactly match the candidate")
          print(f"verified {len(actual)} public release assets")
          PY

      - name: Verify the public update endpoints
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          ./scripts/verify-release-canary.sh \
            --version "${VERSION}" \
            --firmware-config validated/assets/publish/firmware/firmware-manifest.json

  # Microsoft Store (EXE/MSI) needs a versioned HTTPS URL that answers
  # directly; GitHub release downloads redirect and are rejected. The public
  # installer is mirrored once per version and never overwritten, so a Store
  # submission keeps pointing at immutable bytes. This is its own job so a
  # failed mirror can be re-run alone after the release already exists.
  mirror-store-package:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      # Azure sign-in uses OIDC federation; no storage key exists in GitHub.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.publish-release.outputs.version }}
      STORE_ACCOUNT: vibetvdownloads
      STORE_CONTAINER: windows
    steps:
      - name: Checkout the Store submission script from the candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/submit-microsoft-store.py
          sparse-checkout-cone-mode: false

      - name: Download the approved candidate payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vibetv-validated-publish
          path: validated

      - name: Download the public installer and match the approved hash
        id: installer
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern VibeTV-Control-Center-Setup.exe --dir store
          expected="$(python3 - validated/publish-payload.json <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [item["sha256"] for item in payload["artifacts"]
                     if item["name"] == "VibeTV-Control-Center-Setup.exe"]
          if len(matches) != 1:
              raise SystemExit("approved payload must list exactly one Windows installer")
          print(matches[0])
          PY
          )"
          actual="$(sha256sum store/VibeTV-Control-Center-Setup.exe | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] \
            || { echo "error: public installer does not match the approved candidate" >&2; exit 1; }
          echo "sha256=${expected}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure for the Store download mirror
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}

      - name: Mirror the verified Windows installer for the Microsoft Store
        id: mirror
        env:
          EXPECTED_SHA256: ${{ steps.installer.outputs.sha256 }}
        run: |
          set -euo pipefail
          installer="store/VibeTV-Control-Center-Setup.exe"
          blob="v${VERSION}/VibeTV-Control-Center-Setup.exe"
          url="https://${STORE_ACCOUNT}.blob.core.windows.net/${STORE_CONTAINER}/${blob}"
          exists="$(az storage blob exists --auth-mode login \
            --account-name "$STORE_ACCOUNT" --container-name "$STORE_CONTAINER" \
            --name "$blob" --query exists -o tsv --only-show-errors)"
          if [[ "$exists" == "true" ]]; then
            echo "Store mirror already exists; verifying its bytes instead of re-uploading"
          else
            az storage blob upload \
              --auth-mode login \
              --account-name "$STORE_ACCOUNT" \
              --container-name "$STORE_CONTAINER" \
              --name "$blob" \
              --file "$installer" \
              --content-type application/vnd.microsoft.portable-executable \
              --overwrite false \
              --only-show-errors
          fi
          read -r status redirects < <(curl -sS -o store-check.exe -w '%{http_code} %{num_redirects}\n' "$url")
          [[ "$status" == 200 && "$redirects" == 0 ]] \
            || { echo "error: Store URL answered ${status} after ${redirects} redirects" >&2; exit 1; }
          [[ "$(sha256sum store-check.exe | cut -d' ' -f1)" == "$EXPECTED_SHA256" ]] \
            || { echo "error: Store mirror bytes differ from the approved installer" >&2; exit 1; }
          echo "Microsoft Store package URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Replaces the manual Partner Center step: point the Store listing at
      # the new mirror URL and submit it for certification. Sign-in uses the
      # same OIDC federation (Partner Center "Manager" role), so no Store key
      # exists in GitHub. If an older submission is still in review, this
      # step fails and can be re-run once that review is finished.
      - name: Submit the new installer to the Microsoft Store
        env:
          STORE_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          STORE_SELLER_ID: "96319640"
          STORE_PRODUCT_ID: d4931da5-d263-43b4-a2b7-2872ce593e9d
          PACKAGE_URL: ${{ steps.mirror.outputs.url }}
        run: |
          set -euo pipefail
          python3 scripts/submit-microsoft-store.py --package-url "$PACKAGE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
